      - "\u2014"  # Em dash
      - "\u05B0\u05B1\u05B2\u05B3\u05B4\u05B5\u05B6\u05B7\u05B8\u05B9\u05BB\u05BC\u05BD\u05C1\u05C2"

  - file: "gfonts://Noto Sans Hebrew"
    id: alef_mid
    size: 20
    glyphs:
      - " !\"#$%&'()*+,-./0123456789:;<=>?@[\\]^_`{|}~"
      - "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
      - "\u05D0\u05D1\u05D2\u05D3\u05D4\u05D5\u05D6\u05D7\u05D8\u05D9\u05DB\u05DC\u05DE\u05E0\u05E1\u05E2\u05E4\u05E6\u05E7\u05E8\u05E9\u05EA\u05DA\u05DD\u05DF\u05E3\u05E5"
      - "\u05F4"
      - "\u05F3"  # Geresh
      - "\u05BE"  # Maqaf
      - "\u2014"  # Em dash
      - "\u05B0\u05B1\u05B2\u05B3\u05B4\u05B5\u05B6\u05B7\u05B8\u05B9\u05BB\u05BC\u05BD\u05C1\u05C2"

  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi
    size: 22
