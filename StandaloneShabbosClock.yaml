      - "\U000F17D3" # candle
      - "\U000F059B" # sunset/havdalah
      - "\U000F1CCC" # book
      - "\U000F1B04" # synagogue
      - "\U000F097A" # Magen David
      - "\U000F05E2" # menorah
      - "\U000F00EE" # calendar
      - "\U000F023F" # qrcode
      - "\U000F0341" # wifi
      - "\U000F049A" # arrow-left
      - "\U000F0231" # keypad

image:
  - platform: file
    file: background.jpg
    id: background
    resize: 480x320
    type: RGB565

api:
  encryption:
    key: ${api_key}
