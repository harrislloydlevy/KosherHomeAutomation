---
substitutions:
  name: standalone-shabbosclock
  friendly_name: "Standalone Shabbos Clock"
  api_key: !secret api_key
  ota_password: !secret ota_password
  ap_password: !secret ap_password
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - include/shabbos_clock_helpers.h
  on_boot:
    - priority: -100
      then:
        - logger.log: "Booted — fetching HebCal data"
        - script.execute: get_jdate

packages:
  board: !include ./board_cyd35.yaml

http_request:

globals:
  - id: doc
    type: JsonDocument
  - id: geoname_id
    type: int
    initial_value: '2147714'
    restore_value: true
  - id: geoname_idx
    type: int
    initial_value: '0'
    restore_value: false
  - id: display_mode
    type: int
    initial_value: '0'
    restore_value: false
  - id: geo_input
    type: std::string
    initial_value: '""'
    restore_value: false

qr_code:
  - id: ap_qr
    value: "http://192.168.4.1/"
    ecc: LOW

sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

text_sensor:
  - platform: wifi_info
    ssid:
      name: "WiFi SSID"
      id: wifi_ssid_sensor

script:
  - id: get_jdate
    mode: restart
    then:
      - logger.log: "Fetching HebCal data"
      - http_request.get:
            max_response_buffer_size: 32768
            url: !lambda |-
                auto t = id(sntp_time).now();
                return build_hebcal_url(id(geoname_id), t.year, t.month, t.day_of_month);
            capture_response: true
            on_response:
              then:
                - if:
                    condition:
                        lambda: return response->status_code == 200;
                    then:
                        - lambda: |-
                            ESP_LOGI("http_body", "Content Length: %d", response->content_length);
                            parse_hebcal_response(id(doc), body);
                        - lambda: |-
                            id(main_display).update();
                    else:
                        - logger.log:
                            format: "HTTP error: %d"
                            args: ['response->status_code']

  - id: set_location
    mode: restart
    parameters:
      search_id: int
    then:
      - lambda: |-
          id(geoname_id) = search_id;
      - script.execute: get_jdate

  - id: set_location_from_string
    mode: restart
    then:
      - lambda: |-
          int gid = atoi(id(geo_input).c_str());
          if (gid > 0) {
            id(geoname_id) = gid;
            id(geo_input) = "";
          }
      - script.execute: get_jdate

logger:

ota:
  - platform: esphome
    password: ${ota_password}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: "Shabbos Clock Setup"

captive_portal:

safe_mode:

time:
  - platform: sntp
    timezone: "Australia/Sydney"
    id: sntp_time
    servers:
     - 0.pool.ntp.org
     - 1.pool.ntp.org
     - 2.pool.ntp.org
    on_time:
      - seconds: 0
        minutes: /30
        then:
          - script.execute: get_jdate
    on_time_sync:
      then:
        - script.execute: get_jdate

font:
  - file: "gfonts://Noto Sans Hebrew"
    id: alef
    size: 14
    glyphs:
      - " !\"#$%&'()*+,-./0123456789:;<=>?@[\\]^_`{|}~"
      - "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
      - "\u05D0\u05D1\u05D2\u05D3\u05D4\u05D5\u05D6\u05D7\u05D8\u05D9\u05DB\u05DC\u05DE\u05E0\u05E1\u05E2\u05E4\u05E6\u05E7\u05E8\u05E9\u05EA\u05DA\u05DD\u05DF\u05E3\u05E5"
      - "\u05F4"
      - "\u05F3"  # Geresh used in Hebrew dates (e.g. ז׳)
      - "\u05B0\u05B1\u05B2\u05B3\u05B4\u05B5\u05B6\u05B7\u05B8\u05B9\u05BB\u05BC\u05BD\u05C1\u05C2"

  - file: "gfonts://Noto Sans Hebrew"
    id: alef_mid
    size: 20
    glyphs:
      - " !\"#$%&'()*+,-./0123456789:;<=>?@[\\]^_`{|}~"
      - "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
      - "\u05D0\u05D1\u05D2\u05D3\u05D4\u05D5\u05D6\u05D7\u05D8\u05D9\u05DB\u05DC\u05DE\u05E0\u05E1\u05E2\u05E4\u05E6\u05E7\u05E8\u05E9\u05EA\u05DA\u05DD\u05DF\u05E3\u05E5"
      - "\u05F4"
      - "\u05F3"  # Geresh
      - "\u05B0\u05B1\u05B2\u05B3\u05B4\u05B5\u05B6\u05B7\u05B8\u05B9\u05BB\u05BC\u05BD\u05C1\u05C2"

  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi
    size: 22
    glyphs:
      - "\U000F17D3" # candle
      - "\U000F059B" # sunset/havdalah
      - "\U000F1CCC" # book
      - "\U000F1B04" # synagogue
      - "\U000F097A" # Magen David
      - "\U000F05E2" # menorah
      - "\U000F00EE" # calendar
      - "\U000F023F" # qrcode
      - "\U000F0341" # wifi
      - "\U000F049A" # arrow-left
      - "\U000F0231" # keypad

image:
  - file: background.jpg
    id: background
    resize: 480x320
    type: RGB565

api:
  encryption:
    key: ${api_key}
