# Board: Sunton ESP32-3248S035R ("Yellow CYD" 3.5", 320x480 ST7796, XPT2046 resistive touch)
# Classic ESP32-WROOM-32 (4MB flash, no PSRAM), USB-C power/programming.
#
# SINGLE shared SPI bus (LCD + Touch share SCLK/MOSI/MISO):
#   bus:  SCK=GPIO14 MOSI=GPIO13 MISO=GPIO12
#   LCD:  CS=GPIO15 DC=GPIO2 BL=GPIO27 (RST tied to EN, no software reset)
#   Touch XPT2046: CS=GPIO33  (IRQ=GPIO36 NOT used — ESP32 WiFi glitch bug; poll)
#
# Pinout source: https://macsbug.wordpress.com/2022/10/02/esp32-3248s035/
# Note: 3.5" S035 differs from the 2.8" S028 — backlight is GPIO27 (not GPIO21),
# and touch shares the TFT bus with CS33 (not a separate 25/32/39 bus).

packages:
  display: !include ./display_cyd35.yaml

esp32:
  board: esp32dev
  framework:
    type: arduino
    sdkconfig_options:
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

spi:
  - id: spi_bus
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin:
      number: GPIO12
      ignore_strapping_warning: true

binary_sensor:
  - id: boot_button
    platform: gpio
    name: Boot Button
    pin:
      number: GPIO0
      ignore_strapping_warning: true
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      - lambda: 'ESP_LOGI("nav", "Boot button PRESSED");'
    on_click:
      - min_length: 0ms
        max_length: 1000ms
        then:
          - lambda: |-
              id(show_qr) = !id(show_qr);
              id(need_display_update) = true;
              ESP_LOGI("nav", "Boot button short -> show_qr=%d", id(show_qr));
      - min_length: 1000ms
        max_length: 5000ms
        then:
          - lambda: |-
              ESP_LOGI("nav", "Boot button long -> clear WiFi + reboot (AP mode)");
              wifi::global_wifi_component->clear_sta();
              wifi::global_wifi_component->save_wifi_sta("", "");
              App.safe_reboot();
    on_release:
      - lambda: 'ESP_LOGI("nav", "Boot button RELEASED");'
