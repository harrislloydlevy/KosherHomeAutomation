# Display: ST7796 3.5" 320x480, SPI (shared bus on board_cyd35.yaml)
# Touch:  XPT2046 resistive, SPI (shared bus), CS=GPIO33 — IRQ on GPIO36 NOT used
#         (ESP32 chip bug: GPIO36/39 glitch when WiFi active -> touch crash; poll instead)
# Backlight: GPIO27 (active high) — NOTE: 3.5" S035 uses GPIO27, not GPIO21 like the 2.8"
#
# Pinout source: https://macsbug.wordpress.com/2022/10/02/esp32-3248s035/

# Backlight: GPIO27 driven HIGH always (plain GPIO switch, no PWM).
# Using a switch instead of ledc+monochromatic to avoid any PWM/gamma/transition
# behaviour that caused visible flicker. Dimming isn't needed for a Shabbos clock.
switch:
  - id: display_backlight
    platform: gpio
    pin: GPIO27  # LCD_BL (active high)
    name: Display Backlight
    icon: "mdi:television"
    entity_category: config
    restore_mode: ALWAYS_ON

display:
  - id: main_display
    platform: mipi_spi
    model: ST7796
    spi_id: spi_bus
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    data_rate: 40MHz
    update_interval: never
    auto_clear_enabled: false
    # Do NOT set 'rotation' here — LVGL requires it on the lvgl: block instead.
    # ST7796 is 16-bit RGB565 (lighter on RAM than 18-bit); mipi_spi auto-sizes a
    # small draw buffer (~1/8) since this WROOM has no PSRAM.

touchscreen:
  - id: main_touchscreen
    platform: xpt2046
    spi_id: spi_bus  # Touch shares the TFT SPI bus (SCK14/MOSI13/MISO12)
    cs_pin: GPIO33
    # NO interrupt_pin: GPIO36 glitches when WiFi is active (ESP32 chip bug) and
    # crashes the touch read. Polling (the default without interrupt_pin) is the
    # reliable mode on this board per the macsbug writeup.
    display: main_display
    threshold: 400
    # Calibration based on the macsbug ESP32-3248S035R writeup (clamped to the
    # 12-bit ADC max of 4095 — ESPHome rejects values above that).
    # Do NOT set swap_xy: LVGL applies the 90° rotation itself (rotate_coordinates),
    # and the display reports native 320x480 — so touch must map raw→native and
    # LVGL rotates. Refine by reading x_raw/y_raw at the screen corners if needed.
    calibration:
      x_min: 360
      x_max: 4095
      y_min: 180
      y_max: 3900
    # If touch is mirrored after this, enable the relevant flag(s):
    # transform:
    #   mirror_x: true
    #   mirror_y: true
    on_touch:
      - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%d, z=%d",
              touch.x, touch.y, touch.x_raw, touch.y_raw, touch.z_raw);
