switch:
  - id: display_backlight
    platform: gpio
    pin: GPIO27
    name: Display Backlight
    icon: "mdi:television"
    entity_category: config
    restore_mode: ALWAYS_ON

display:
  - id: main_display
    platform: mipi_spi
    model: ST7796
    spi_id: spi_bus
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    data_rate: 40MHz
    auto_clear_enabled: false
    rotation: 90
    transform:
      mirror_y: true
      mirror_x: false
      swap_xy: false
    dimensions:
      width: 320
      height: 480

    lambda: |-
        auto t = id(sntp_time).now();
        render_shabbos(it, id(doc), id(alef), id(alef_mid), id(mdi), id(background),
            t.year, t.month, t.day_of_month,
            t.hour, t.minute, t.day_of_week, id(geoname_idx));

touchscreen:
  - id: main_touchscreen
    platform: xpt2046
    spi_id: spi_bus
    cs_pin: GPIO33
    display: main_display
    threshold: 400
    calibration:
      x_min: 712
      x_max: 3506
      y_min: 851
      y_max: 3420
    transform:
      swap_xy: true
      mirror_x: true
    on_touch:
      - lambda: |-
          static int idx = 0;
