---
substitutions:
  name: bedsideDisplay
  friendly_name: "Bedside Display"
  api_key: !secret api_key
  ota_password: !secret ota_password
  ap_password: !secret ap_password
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

packages:
  board: !include ./board.yaml

ignore_strapping_warning: true

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - logger.log: "Booted Screen"

text_sensor:
  - platform: homeassistant
    name: "Stream of Weight Measurements"
    entity_id: sensor.weight_lts_history_string
    id: weight_stream
    on_value:
      - script.execute: redraw_weight_graph
          
  - platform: homeassistant
    name: "Stream of Fat Pct Measurements"
    entity_id: sensor.fat_pct_lts_history_string
    id: fat_stream

binary_sensor:
  - platform: homeassistant
    id: ha_light_state
    entity_id: light.master_bedroom_light # Change this to your HA entity ID
    on_state:
      - lvgl.widget.update:
          id: lvgl_light_switch
          state:
            checked: !lambda "return x;"

  - platform: homeassistant
    id: ha_fan_state
    entity_id: fan.master_bedroom_fan # Change this to your HA entity ID
    on_state:
      - lvgl.widget.update:
          id: lvgl_fan_switch
          state:
            checked: !lambda "return x;"

  - platform: homeassistant
    id: ha_floor_light_state
    entity_id: light.floor_light   # Change this to your HA entity ID
    on_state:
      - lvgl.widget.update:
          id: lv_floor_light_switch
          state:
            checked: !lambda "return x;"

  - platform: homeassistant
    id: ha_bathroom_light_state
    entity_id: light.bathroom_light   # Change this to your HA entity ID
    on_state:
      - lvgl.widget.update:
          id: lv_bathroom_switch
          state:
            checked: !lambda "return x;"

logger:

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

script:
  - id: redraw_weight_graph
    then:
      - lvgl.draw_canvas:
          id: weight_canvas
          x: 35
          y: 0
          width: 275
          height: 105
          color: 0x111827
          fill: true
      - lambda: |-
          // Parse the weight string and draw the line graph
          std::string str = id(weight_stream).state;
          std::vector<float> values;
          std::stringstream ss(str);
          std::string item;
          while (std::getline(ss, item, ',')) {
            try {
              values.push_back(std::stof(item));
            } catch (...) {
              // Ignore invalid values
            }
          }
          
          if (values.empty()) return;
          
          // Draw the line graph
          int canvas_width = 275;
          int canvas_height = 105;
          int point_count = values.size();
          int max_points = 50; // Limit number of points to display
          
          // If we have more points than we can display, show the most recent ones
          int start_index = 0;
          if (point_count > max_points) {
            start_index = point_count - max_points;
          }
          
          // Find min/max values for scaling
          float min_val = values[start_index];
          float max_val = values[start_index];
          for (int i = start_index; i < point_count; i++) {
            if (values[i] < min_val) min_val = values[i];
            if (values[i] > max_val) max_val = values[i];
          }
          
          // Add some padding to the scale
          float range = max_val - min_val;
          if (range == 0) range = 1; // Avoid division by zero
          min_val -= range * 0.1;
          max_val += range * 0.1;
          
          // Draw the line graph
          for (int i = start_index; i < point_count - 1; i++) {
            int x1 = ((i - start_index) * canvas_width) / (point_count - start_index - 1);
            int y1 = canvas_height - ((values[i] - min_val) * canvas_height) / (max_val - min_val);
            int x2 = ((i + 1 - start_index) * canvas_width) / (point_count - start_index - 1);
            int y2 = canvas_height - ((values[i + 1] - min_val) * canvas_height) / (max_val - min_val);
            
            // Draw line segment
            lvgl_draw_line(x1 + 35, y1, x2 + 35, y2, 0x10B981);
          }

lvgl:
  displays: [main_display]
  touchscreens: [main_touchscreen]
  rotation: 270

  pages:
    - id: main_page
      bg_color: 0x111827
      pad_all: 0
      widgets:
