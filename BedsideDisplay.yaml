---
substitutions:
  name: bedsideDisplay
  friendly_name: "Bedside Display"
  api_key: !secret api_key
  ota_password: !secret ota_password
  ap_password: !secret ap_password
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

packages:
  board: !include ./board.yaml

ignore_strapping_warning: true

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - logger.log: "Booted Screen"

text_sensor:
  - platform: homeassistant
    name: "Stream of Weight Measurements"
    entity_id: sensor.weight_lts_history_string
    id: weight_stream
          
  - platform: homeassistant
    name: "Stream of Fat Pct Measurements"
    entity_id: sensor.fat_pct_lts_history_string
    id: fat_stream

binary_sensor:
  - platform: homeassistant
    id: ha_light_state
    entity_id: light.master_bedroom_light # Change this to your HA entity ID
    on_state:
      - lvgl.widget.update:
          id: lvgl_light_switch
          state:
            checked: !lambda "return x;"

  - platform: homeassistant
    id: ha_fan_state
    entity_id: fan.master_bedroom_fan # Change this to your HA entity ID
    on_state:
      - lvgl.widget.update:
          id: lvgl_fan_switch
          state:
            checked: !lambda "return x;"

  - platform: homeassistant
    id: ha_floor_light_state
    entity_id: light.floor_light   # Change this to your HA entity ID
    on_state:
      - lvgl.widget.update:
          id: lv_floor_light_switch
          state:
            checked: !lambda "return x;"

  - platform: homeassistant
    id: ha_bathroom_light_state
    entity_id: light.bathroom_light   # Change this to your HA entity ID
    on_state:
      - lvgl.widget.update:
          id: lv_bathroom_switch
          state:
            checked: !lambda "return x;"

logger:

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

lvgl:
  displays: [main_display]
  touchscreens: [main_touchscreen]
  rotation: 270

  pages:
    - id: main_page
      bg_color: 0x111827
      pad_all: 0
      widgets:
        - obj:
            id: shb_bar
            x: 0
            y: 0
            width: 320
            height: 35
            align: TOP_MID
            bg_color: 0x070E1B
            bg_opa: 95%
            border_width: 1
            border_color: 0x707070
            radius: 4
            outline_width: 2
            pad_all: 0
            widgets:
              - label:
                  id: shb_title
                  x: 5
                  y: 4
                  width: 200
                  height: 27
                  align: LEFT_MID
                  text: "Bedroom Control"
                  text_color: 0xF1F5F9
                  text_align: LEFT
                  long_mode: CLIP
                  text_font: montserrat_16
              - label:
                  id: shb_wifi
                  x: 290
                  y: 8
                  width: 21
                  height: 20
                  text: "\uF1EB"
                  text_font: montserrat_14
                  text_align: CENTER
                  text_color: 0x10B981

        - obj:
            id: widget_1782905502876_q5ny8xwof
            x: 0
            y: -60
            width: 155
            height: 40
            align: LEFT_MID
            bg_color: 0x070E1B
            bg_opa: 95%
            border_width: 1
            border_color: 0x707070
            radius: 4
            outline_width: 2
            pad_all: 0
            widgets:
              - label:
                  id: lv_icon_13
                  x: 0
                  y: 0
                  width: 35
                  height: 38
                  text: "\U000F0769"
                  text_font: mdi_icons_24
                  text_align: CENTER
                  text_color: 0xFFFFFF
              - switch:
                  id: lvgl_light_switch
                  x: -4
                  y: 0
                  width: 60
                  height: 30
                  align: RIGHT_MID
                  state:
                    checked: true
                  bg_color: 0x4B5563
                  indicator:
                    checked:
                      bg_color: 0x10B981
                  knob:
                    bg_color: 0xFFFFFF
                    border_color: 0x9CA3AF
                    border_width: 1
                  on_value:
                    - logger.log:
                        format: "Light switch toggled, value=%d"
                        args: [ 'x' ]
                    - homeassistant.service:
                        service: light.toggle
                        data:
                          entity_id: light.master_bedroom_light

        - obj:
            id: widget_1782905631871_fcfo7awm6
            x: 165
            y: -60
            width: 155
            height: 40
            align: LEFT_MID
            bg_color: 0x070E1B
            bg_opa: 95%
            border_width: 1
            border_color: 0x707070
            radius: 4
            outline_width: 2
            pad_all: 0
            widgets:
              - label:
                  id: widget_1782905631871_6u47nocfl
                  x: 0
                  y: 0
                  width: 35
                  height: 38
                  text: "\U000F0210"
                  text_font: mdi_icons_24
                  text_align: CENTER
                  text_color: 0xFFFFFF
              - switch:
                  id: lvgl_fan_switch
                  x: -4
                  y: 0
                  width: 60
                  height: 30
                  align: RIGHT_MID
                  state:
                    checked: true
                  bg_color: 0x4B5563
                  indicator:
                    checked:
                      bg_color: 0x10B981
                  knob:
                    bg_color: 0xFFFFFF
                    border_color: 0x9CA3AF
                    border_width: 1
                  on_value:
                    - logger.log:
                        format: "Fan switch toggled, value=%d"
                        args: [ 'x' ]
                    - homeassistant.service:
                        service: fan.toggle
                        data:
                          entity_id: fan.master_bedroom_fan

        - obj:
            id: widget_1782905702067_7i25xb6q3
            x: 165
            y: -15
            width: 155
            height: 40
            align: LEFT_MID
            bg_color: 0x070E1B
            bg_opa: 95%
            border_width: 1
            border_color: 0x707070
            radius: 4
            outline_width: 2
            pad_all: 0
            widgets:
              - label:
                  id: widget_1782905702067_dzx73ti7q
                  x: 0
                  y: 0
                  width: 35
                  height: 38
                  text: "\U000F09A0"
                  text_font: mdi_icons_24
                  text_align: CENTER
                  text_color: 0xFFFFFF
              - switch:
                  id: lv_floor_light_switch
                  x: -4
                  y: 0
                  width: 60
                  height: 30
                  align: RIGHT_MID
                  state:
                    checked: true
                  bg_color: 0x4B5563
                  indicator:
                    checked:
                      bg_color: 0x10B981
                  knob:
                    bg_color: 0xFFFFFF
                    border_color: 0x9CA3AF
                    border_width: 1
                  on_value:
                    - logger.log:
                        format: "Floor light switch toggled, value=%d"
                        args: [ 'x' ]
                    - homeassistant.service:
                        service: light.toggle
                        data:
                          entity_id: light.floor_light

        - obj:
            id: widget_1782905750837_k1ykruh1w
            x: 0
            y: -15
            width: 155
            height: 40
            align: LEFT_MID
            bg_color: 0x070E1B
            bg_opa: 95%
            border_width: 1
            border_color: 0x707070
            radius: 4
            outline_width: 2
            pad_all: 0
            widgets:
              - label:
                  id: widget_1782905750838_xcnfthr9k
                  x: 0
                  y: 0
                  width: 35
                  height: 38
                  text: "\U000F08DD"
                  text_font: mdi_icons_24
                  text_align: CENTER
                  text_color: 0xFFFFFF
              - switch:
                  id: lv_bathroom_switch
                  x: -4
                  y: 0
                  width: 60
                  height: 30
                  align: RIGHT_MID
                  state:
                    checked: true
                  bg_color: 0x4B5563
                  indicator:
                    checked:
                      bg_color: 0x10B981
                  knob:
                    bg_color: 0xFFFFFF
                    border_color: 0x9CA3AF
                    border_width: 1
                  on_value:
                    - logger.log:
                        format: "Bathroom light switch toggled, value=%d"
                        args: [ 'x' ]
                    - homeassistant.service:
                        service: light.toggle
                        data:
                          entity_id: light.bathroom_light

        - obj:
            id: graph_area
            x: 5
            y: 130
            width: 310
            height: 105
            bg_color: 0x4F46E5
            border_width: 1
            border_color: 0x4B5563
            radius: 8
            pad_all: 0



esp32_ble_tracker:
  scan_parameters:
    interval: 110ms
    window: 110ms
    active: true

bluetooth_proxy:
  active: true

api:
 encryption:
   key: ${api_key}



font:
  - file:
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@latest/fonts/materialdesignicons-webfont.ttf"
      type: web
    id: mdi_icons_24
    size: 24
    glyphs: [
      "\U000F0769",  # Ceiling Light
      "\U000F0210",  # Fan
      "\U000F09A0",  # Shower
      "\U000F08DD",  # Floor Lamp
    ]
